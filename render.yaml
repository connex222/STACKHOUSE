# Phase 3 private multiplayer requires a running Node web service, not a static site.
services:
  - type: web
    name: stackhouse-social
    runtime: node
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    # Note: session snapshots persist across restarts only when ROOM_DATA_FILE
    # points to a real persistent volume. An ephemeral instance won't retain them.
