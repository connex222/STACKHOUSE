# Phase 3 private multiplayer requires a running Node web service, not a static site.
services:
  - type: web
    name: stackhouse-social
    runtime: node
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    # Phase 11: opt-in PostgreSQL persistence is activated by the secret
    # DATABASE_URL environment variable (configure directly in Render).
    # ROOM_DATA_FILE works only with a genuinely persistent disk.
    # Without either setting, rooms are deliberately memory-only.
