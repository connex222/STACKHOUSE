name: Phase 24 multiplayer and TV browser acceptance
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  multiplayer-tv-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/phase24-browser-acceptance.py
