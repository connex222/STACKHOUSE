name: Verify imported Sonilo and Mirelo audio
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify imported audio assets
        shell: bash
        run: |
          set -euo pipefail
          for cue in card-place tile-place victory; do test -s "assets/audio/${cue}.mp3"; done
          test -d assets/audio/masters
          test "$(find assets/audio/masters -maxdepth 1 -type f | wc -l)" -ge 5
          npm install
          npm test
          npm run build
