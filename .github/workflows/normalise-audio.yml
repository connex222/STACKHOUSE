name: Level game sound effects
on:
  push:
    branches: [main]
    paths:
      - scripts/normalise-audio.mjs
      - .github/workflows/normalise-audio.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install sound-processing dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version
      - name: Normalise published game cues (keep all provider masters untouched)
        run: node scripts/normalise-audio.mjs
      - name: Verify corrected asset levels
        run: STACKHOUSE_LEVELLED_AUDIO=1 node --test tests/phase20-sound-levels.test.js
      - name: Commit corrected levels
        shell: bash
        run: |
          set -euo pipefail
          git add assets/audio/*.mp3
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Audio: raise quiet game samples to consistent playback levels'
            git push
          fi
